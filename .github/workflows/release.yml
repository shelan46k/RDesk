name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Three-part version, e.g. 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim().TrimStart("vV")
          } else {
            $v = "${{ github.ref_name }}".TrimStart("vV")
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 1.0.0, got '$v'"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish src/RDesk/RDesk.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/win-x64

      - name: Pack and upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ steps.ver.outputs.version }}"
          $repo = "https://github.com/${{ github.repository }}"
          $releases = Join-Path $env:GITHUB_WORKSPACE "Releases"
          $icon = Join-Path $env:GITHUB_WORKSPACE "src\RDesk\Assets\rdesk.ico"
          $packDir = Join-Path $env:GITHUB_WORKSPACE "publish\win-x64"

          dotnet tool install -g vpk --version 1.2.161
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          # First release has nothing to download; later ones need it for delta packages.
          vpk download github --repoUrl $repo --token $env:GITHUB_TOKEN --outputDir $releases
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous Velopack release yet (ok for the first publish)."
          }

          vpk pack --packId RDesk --packVersion $v --packDir $packDir --mainExe RDesk.exe --packTitle RDesk --icon $icon --outputDir $releases
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }

          vpk upload github --repoUrl $repo --token $env:GITHUB_TOKEN --outputDir $releases --publish --releaseName "RDesk $v" --tag "v$v"
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed" }
